name: Build RemNote Plugin

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Type-check, test analytics, and build plugin
        run: npm run build:ci

      - name: Upload installable RemNote ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CRNA-Performance-Analytics-v2.1.0
          path: PluginZip.zip
          if-no-files-found: error
          retention-days: 90
